version = 1

; Per-model router presets.
; Keys = llama-server args without leading dashes; section name = model id
; as the router reports it (GET /v1/models).
;
; The ggml-org Qwen3.8-27B GGUFs ship the MTP draft head as a separate file
; (the bundled-tensor builds are Unsloth UD / LM Studio). Attach it here so
; --spec-type draft-mtp (set router-wide in the launchd plist) has a head to
; draft from. Draft is Q8_0 for higher acceptance; ~3.2GB of the ~37GB budget.
[Qwen3.8-27B-Q4_K_M]
spec-draft-model = /Users/garyjohnson/models/Qwen3.8-27B-Q4_K_M/mtp-Qwen3.8-27B-Q8_0.gguf
